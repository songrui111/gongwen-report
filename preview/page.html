<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公文版式预览</title>
<!-- 版式在 paper.css，渲染和打标在 report.js。
     两个库走 vendor/ 本地文件：版式判据量的是真页面，CDN 挂了或版本漂了都不行。 -->
<link rel="stylesheet" href="paper.css">
<style>
  /* 说明不在纸上：它在 .report-content 外面，打印时按那条白名单一起藏掉。 */
  .hint {
    width: 210mm; margin: 0 auto 10px; color: #6b7280; font-size: 13px; line-height: 1.7;
  }
  .hint code { background: #eef1f5; padding: 1px 5px; border-radius: 3px; }
  @media print { .hint { display: none !important; } }
</style>
</head>
<body>
<div class="hint">
  空的纸。把一份 Markdown 报告放进来：<br>
  <code>py preview/build.py 报告.md --png 报告.png</code>
  按 GB/T 9704—2012 排出来的样子；<code>--pdf 报告.pdf</code> 出可打印 PDF；
  <code>--break indent</code>（或 sign / font / table / paper）故意改坏一处。
</div>
<!-- 落款 .doc-sign 必须是 .rendered 的兄弟节点，和它一起挂在 .report-content 底下。
     字号和字族那对变量挂在 .report-content 上，挪进 .rendered 就继承不到，掉回 12pt。 -->
<div class="report-content" id="reportContent">
  <div class="rendered" id="reportRendered"></div>
</div>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="report.js"></script>
</body>
</html>
